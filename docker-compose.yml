services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ruhi-boutique:0.1.0
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      APP_URL: http://localhost:8001
      ADMIN_PIN: ${ADMIN_PIN:?Set ADMIN_PIN in .env}
      ALLOW_INSECURE_DEFAULT_PIN: ${ALLOW_INSECURE_DEFAULT_PIN:-}
