# Free-tier live stack on Render (web) + Neon Free (Postgres)
# Site: https://ruhitrends.com · fallback https://ruhi-boutique.onrender.com
#
# DATABASE_URL must be set in the Render dashboard to your Neon pooled
# connection string (do not commit secrets).

services:
  - type: web
    name: ruhitrends
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: APP_URL
        value: https://ruhitrends.com
      - key: ADMIN_PIN
        sync: false
      - key: DATABASE_URL
        sync: false
